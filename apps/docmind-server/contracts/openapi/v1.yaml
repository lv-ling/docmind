      properties:
        preview: { $ref: '#/components/schemas/SourcePreview' }
        view_url: { type: [string, 'null'] }
        original_content_url: { type: string }
    SchemaFieldDefault:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { const: none }
        - type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind: { const: literal }
            value: true
    SchemaFieldConstraints:
      type: object
      additionalProperties: false
      required: [format, pattern, enum_values, min_length, max_length, minimum, maximum]
      properties:
        format: { type: [string, 'null'], maxLength: 100 }
        pattern: { type: [string, 'null'], maxLength: 2000, description: RE2-safe pattern }
        enum_values: { type: array, maxItems: 200, items: true }
        min_length: { type: [integer, 'null'], minimum: 0 }
        max_length: { type: [integer, 'null'], minimum: 0 }
        minimum: { type: [number, 'null'] }
        maximum: { type: [number, 'null'] }
