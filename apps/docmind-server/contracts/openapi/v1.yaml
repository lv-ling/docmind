        nullable: { type: boolean }
        default: { $ref: '#/components/schemas/SchemaFieldDefault' }
        sensitivity: { enum: [none, low, medium, high] }
        constraints: { $ref: '#/components/schemas/SchemaFieldConstraints' }
        examples: { type: array, maxItems: 20, items: true }
        extraction_hint: { type: [string, 'null'], maxLength: 2000 }
        display: { $ref: '#/components/schemas/SchemaFieldDisplay' }
        metadata: { type: object, additionalProperties: true }
        position: { type: integer, minimum: 0 }
    SchemaField:
      type: object
      additionalProperties: false
      required:
        [
          id,
          key,
          json_path,
          description,
          value_type,
          array_item_type,
          required,
          nullable,
          default,
          sensitivity,
          constraints,
          examples,
          extraction_hint,
          display,
          metadata,
          position,
        ]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, maxLength: 64, pattern: '^[A-Za-z_][A-Za-z0-9_]*$' }
        json_path:
          type: string
          minLength: 3
          maxLength: 500
          pattern: '^\$(?:\.[A-Za-z_][A-Za-z0-9_]*)+$'
        description: { type: string, maxLength: 2000 }
        value_type: { enum: [string, number, integer, boolean, date, datetime, object, array] }
        array_item_type:
          type: [string, 'null']
          enum: [string, number, integer, boolean, date, datetime, object, array, null]
        required: { type: boolean }
        nullable: { type: boolean }
        default: { $ref: '#/components/schemas/SchemaFieldDefault' }
        sensitivity: { enum: [none, low, medium, high] }
        constraints: { $ref: '#/components/schemas/SchemaFieldConstraints' }
        examples: { type: array, maxItems: 20, items: true }
        extraction_hint: { type: [string, 'null'], maxLength: 2000 }
        display: { $ref: '#/components/schemas/SchemaFieldDisplay' }
        metadata: { type: object, additionalProperties: true }
        position: { type: integer, minimum: 0 }
    ExtractionSchema:
      type: object
      additionalProperties: false
      required:
        [
          id,
          workspace_id,
          name,
          description,
          current_version_id,
          created_at,
          created_by,
          updated_at,
          updated_by,
        ]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        current_version_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }
    SchemaVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          schema_id,
          workspace_id,
          version_number,
          status,
          fields,
          json_schema,
          change_summary,
          created_at,
          created_by,
          published_at,
        ]
      properties:
        id: { type: string, format: uuid }
        schema_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        status: { enum: [draft, published, superseded] }
        fields:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/SchemaField' },
          }
        json_schema: { type: object, additionalProperties: true }
        change_summary: { type: string, maxLength: 1000 }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        published_at: { type: [string, 'null'], format: date-time }
    ExtractionSchemaDetail:
      type: object
      additionalProperties: false
      required: [schema, current_version, versions]
      properties:
        schema: { $ref: '#/components/schemas/ExtractionSchema' }
        current_version: { $ref: '#/components/schemas/SchemaVersion' }
        versions: { type: array, items: { $ref: '#/components/schemas/SchemaVersion' } }
    CreateSchemaRequest:
      type: object
      additionalProperties: false
      required: [name, description, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        fields:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/SchemaFieldInput' },
          }
    CreateSchemaVersionRequest:
      type: object
      additionalProperties: false
      required: [fields, change_summary]
      properties:
        fields:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/SchemaFieldInput' },
          }
        change_summary: { type: string, minLength: 1, maxLength: 1000 }
    CreateSchemaTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, description, schema_version_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        schema_version_id: { type: string, format: uuid }
    SchemaTemplate:
      type: object
      additionalProperties: false
      required:
        [
          id,
          workspace_id,
          name,
          description,
          current_schema_version_id,
          created_at,
          created_by,
          updated_at,
          updated_by,
        ]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        current_schema_version_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }
    SensitiveDataType:
      enum:
        [
          china_national_id,
          identity_document,
          passport,
          phone_number,
          email_address,
          credit_card,
          bank_account,
          ip_address,
          person_name,
          location,
          custom,
        ]
    SensitiveRuleInput:
      type: object
      additionalProperties: false
      required:
        [
          key,
          name,
          description,
          data_type,
          recognizer_kind,
          locales,
          country_codes,
          regex_pattern,
          regex_dialect,
          dictionary_terms,
          validator_name,
          confidence_threshold,
          priority,
          enabled,
        ]
      properties:
        key: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        data_type: { $ref: '#/components/schemas/SensitiveDataType' }
        recognizer_kind: { enum: [presidio, regex, dictionary, validator] }
        locales: { type: array, maxItems: 50, items: { type: string, maxLength: 35 } }
        country_codes: { type: array, maxItems: 50, items: { type: string, pattern: '^[A-Z]{2}$' } }
        regex_pattern: { type: [string, 'null'], maxLength: 2000 }
        regex_dialect: { type: [string, 'null'], enum: [re2, null] }
        dictionary_terms:
          { type: array, maxItems: 10000, items: { type: string, minLength: 1, maxLength: 256 } }
        validator_name:
          type: [string, 'null']
          enum:
            [
              cn_resident_identity,
              e164_phone,
              email,
              luhn,
              iban,
              ip_address,
              passport_document,
              null,
            ]
        confidence_threshold: { type: number, minimum: 0, maximum: 1 }
        priority: { type: integer, minimum: -1000, maximum: 1000 }
        enabled: { type: boolean }
    SensitiveRule:
      type: object
      additionalProperties: false
      required:
        [
          id,
          key,
          name,
          description,
          data_type,
          recognizer_kind,
          locales,
          country_codes,
          regex_pattern,
          regex_dialect,
          dictionary_terms,
          validator_name,
          confidence_threshold,
          priority,
          enabled,
        ]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        data_type: { $ref: '#/components/schemas/SensitiveDataType' }
        recognizer_kind: { enum: [presidio, regex, dictionary, validator] }
        locales: { type: array, maxItems: 50, items: { type: string, maxLength: 35 } }
        country_codes: { type: array, maxItems: 50, items: { type: string, pattern: '^[A-Z]{2}$' } }
        regex_pattern: { type: [string, 'null'], maxLength: 2000 }
        regex_dialect: { type: [string, 'null'], enum: [re2, null] }
        dictionary_terms: { type: array, maxItems: 10000, items: { type: string } }
        validator_name:
          type: [string, 'null']
          enum:
            [
              cn_resident_identity,
              e164_phone,
              email,
              luhn,
              iban,
              ip_address,
              passport_document,
              null,
            ]
        confidence_threshold: { type: number, minimum: 0, maximum: 1 }
        priority: { type: integer, minimum: -1000, maximum: 1000 }
        enabled: { type: boolean }
    SensitiveRuleTemplate:
      type: object
      additionalProperties: false
      required:
        [
          id,
          workspace_id,
          name,
          description,
          current_version_id,
          created_at,
          created_by,
          updated_at,
          updated_by,
        ]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        current_version_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }
    SensitiveRuleTemplateVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          template_id,
          workspace_id,
          version_number,
          status,
          rules,
          change_summary,
          created_at,
          created_by,
          published_at,
        ]
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        status: { enum: [draft, published, superseded] }
        rules:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/SensitiveRule' },
          }
        change_summary: { type: string, maxLength: 1000 }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        published_at: { type: [string, 'null'], format: date-time }
    SensitiveRuleTemplateDetail:
      type: object
      additionalProperties: false
      required: [template, current_version, versions]
      properties:
        template: { $ref: '#/components/schemas/SensitiveRuleTemplate' }
        current_version: { $ref: '#/components/schemas/SensitiveRuleTemplateVersion' }
        versions:
          { type: array, items: { $ref: '#/components/schemas/SensitiveRuleTemplateVersion' } }
    CreateSensitiveRuleTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, description, rules]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        rules:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/SensitiveRuleInput' },
          }
    CreateSensitiveRuleTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [rules, change_summary]
      properties:
        rules:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/SensitiveRuleInput' },
          }
        change_summary: { type: string, minLength: 1, maxLength: 1000 }
    CreateExtractionRequest:
      type: object
      additionalProperties: false
      required: [schema_version_id, sensitive_rule_template_version_id]
      properties:
        schema_version_id: { type: string, format: uuid }
        sensitive_rule_template_version_id: { type: [string, 'null'], format: uuid }
    ExtractionDisplayValue:
      oneOf:
        - type: object
          additionalProperties: false
          required: [access, value]
          properties:
            access: { const: visible }
            value: true
        - type: object
          additionalProperties: false
          required: [access, value, masked_preview]
          properties:
            access: { const: masked }
            value: { type: 'null' }
            masked_preview: { type: string, maxLength: 512 }
    ExtractionEvidenceView:
      type: object
      additionalProperties: false
      required: [page_number, node_id, display_text, is_masked, start_offset, end_offset]
      properties:
        page_number: { type: [integer, 'null'], minimum: 1 }
        node_id: { type: string, minLength: 1, maxLength: 255 }
        display_text: { type: string, maxLength: 1000 }
        is_masked: { type: boolean }
        start_offset: { type: [integer, 'null'], minimum: 0 }
        end_offset: { type: [integer, 'null'], minimum: 0 }
    ExtractionCandidateView:
      type: object
      additionalProperties: false
      required: [display_value, confidence, evidence]
      properties:
        display_value: { $ref: '#/components/schemas/ExtractionDisplayValue' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/ExtractionEvidenceView' }
    ExtractionFieldResultView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          json_path,
          display_value,
          value_source,
          missing_reason,
          confidence,
          evidence,
          candidates,
          needs_review,
          review_status,
        ]
      properties:
        id: { type: string, format: uuid }
        json_path: { type: string, minLength: 3, maxLength: 500 }
        display_value: { $ref: '#/components/schemas/ExtractionDisplayValue' }
        value_source: { enum: [extracted, default, manual, 'null'] }
        missing_reason:
          type: [string, 'null']
          enum:
            [
              not_found,
              insufficient_evidence,
              ambiguous,
              invalid_model_output,
              sensitive_token_missing,
              null,
            ]
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/ExtractionEvidenceView' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/ExtractionCandidateView' }
        needs_review: { type: boolean }
        review_status: { enum: [pending, accepted, modified, rejected] }
    ExtractionModelMetadata:
      type: object
      additionalProperties: false
      required: [provider, model, prompt_version, input_tokens, output_tokens]
      properties:
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        input_tokens: { type: [integer, 'null'], minimum: 0 }
        output_tokens: { type: [integer, 'null'], minimum: 0 }
    ExtractionResultView:
      type: object
      additionalProperties: false
      required: [data, contains_masked_values, fields, model, validation_errors]
      properties:
        data: { type: object, additionalProperties: true }
        contains_masked_values: { type: boolean }
        fields:
          type: array
          items: { $ref: '#/components/schemas/ExtractionFieldResultView' }
        model: { $ref: '#/components/schemas/ExtractionModelMetadata' }
        validation_errors: { type: array, items: { type: string } }
    ExtractionRunView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          job_id,
          workspace_id,
          source_version_id,
          schema_version_id,
          sensitive_rule_template_version_id,
          status,
          result,
          failure_code,
          created_at,
          completed_at,
        ]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        schema_version_id: { type: string, format: uuid }
        sensitive_rule_template_version_id: { type: [string, 'null'], format: uuid }
        status: { enum: [queued, running, review_required, approved, failed, retrying] }
        result:
          oneOf:
            - $ref: '#/components/schemas/ExtractionResultView'
            - type: 'null'
        failure_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    ReviewExtractionFieldRequest:
      type: object
      additionalProperties: false
      required: [action, value, reason]
      properties:
        action: { enum: [accept, modify, reject] }
        value: true
        reason: { type: [string, 'null'] }
    ApproveExtractionRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: [string, 'null'] }
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    AcceptedTemplateJob:
      type: object
      additionalProperties: false
      required: [job_id, template_id, request_id]
      properties:
        job_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
    DocumentTemplate:
      type: object
      additionalProperties: false
      required:
        [
          id,
          workspace_id,
          source_document_id,
          source_version_id,
          conversion_job_id,
          name,
          current_version_id,
          conversion_status,
          failure_code,
          created_at,
          created_by,
          updated_at,
          updated_by,
        ]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        source_document_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        conversion_job_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        current_version_id: { type: [string, 'null'], format: uuid }
        conversion_status: { enum: [queued, running, ready, retrying, failed] }
        failure_code: { type: [string, 'null'], maxLength: 100 }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }
    CreateTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [base_version_id, document_model, change_summary]
      properties:
        base_version_id: { type: string, format: uuid }
        document_model: { type: object, additionalProperties: true }
        change_summary: { type: string, minLength: 1, maxLength: 1000 }
    SafeHtmlDocument:
      type: object
      additionalProperties: false
      required: [html, css, sanitization_policy_version]
      properties:
        html: { type: string }
        css: { type: string }
        sanitization_policy_version: { type: string, minLength: 1 }
    TemplateResource:
      type: object
      additionalProperties: false
      required: [id, kind, content_type, byte_size, sha256, download_url]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [image, stylesheet, font, attachment] }
        content_type: { type: string, minLength: 1, maxLength: 100 }
        byte_size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        download_url: { type: string, minLength: 1 }
    ConversionWarning:
      type: object
      additionalProperties: false
      required: [id, severity, code, message, source_node_id, page_number, fallback, blocking]
      properties:
        id: { type: string, format: uuid }
        severity: { enum: [info, warning, error] }
        code: { type: string, minLength: 1, maxLength: 100 }
        message: { type: string, minLength: 1, maxLength: 2000 }
        source_node_id: { type: [string, 'null'], maxLength: 255 }
        page_number: { type: [integer, 'null'], minimum: 1 }
        fallback: { type: [string, 'null'], maxLength: 1000 }
        blocking: { type: boolean }
    ControlledDocumentDiff:
      type: object
      additionalProperties: false
      required: [version, truncated, changes]
      properties:
        version: { const: '1.0' }
        truncated: { type: boolean }
        changes:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [path, kind, before, after]
            properties:
              path: { type: string }
              kind: { enum: [added, removed, changed] }
              before: true
              after: true
    DocumentTemplateVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          template_id,
          workspace_id,
          source_version_id,
          parsed_content_id,
          version_number,
          status,
          document,
          document_model,
          resources,
          warnings,
          change_summary,
          diff,
          created_at,
          created_by,
          published_at,
        ]
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        parsed_content_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        status: { enum: [generated, checking, published, superseded] }
        document: { $ref: '#/components/schemas/SafeHtmlDocument' }
        document_model: { type: object, additionalProperties: true }
        resources:
          type: array
          items: { $ref: '#/components/schemas/TemplateResource' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ConversionWarning' }
        change_summary: { type: string, maxLength: 1000 }
        diff: { $ref: '#/components/schemas/ControlledDocumentDiff' }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        published_at: { type: [string, 'null'], format: date-time }
    DocumentTemplateDetail:
      type: object
      additionalProperties: false
      required: [template, current_version, versions]
      properties:
        template: { $ref: '#/components/schemas/DocumentTemplate' }
        current_version:
          oneOf:
            - $ref: '#/components/schemas/DocumentTemplateVersion'
            - type: 'null'
        versions:
          type: array
          items: { $ref: '#/components/schemas/DocumentTemplateVersion' }
    PublishTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: [string, 'null'], maxLength: 2000 }
    RollbackTemplateRequest:
      type: object
      additionalProperties: false
      required: [target_version_id, change_summary]
      properties:
        target_version_id: { type: string, format: uuid }
        change_summary: { type: string, minLength: 1, maxLength: 1000 }
    DocumentInstance:
      type: object
      required: [id, template_version_id, name, status, current_version_id]
      properties:
        id: { type: string, format: uuid }
        template_version_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [draft, editing, saved, submitted, archived] }
        current_version_id: { type: [string, 'null'], format: uuid }
    CreateDocumentInstanceRequest:
      type: object
      required: [name, initial_data]
      properties:
        name: { type: string, minLength: 1 }
        initial_data: { type: object, additionalProperties: true }
    SaveDocumentInstanceRequest:
      type: object
      required: [document, data, change_summary]
      properties:
        document:
          $ref: '#/components/schemas/SafeHtmlDocument'
        data: { type: object, additionalProperties: true }
        change_summary: { type: string }
    TextAnchor:
      type: object
      required: [node_id, start_offset, end_offset, quote, prefix, suffix]
      properties:
        node_id: { type: string }
        start_offset: { type: integer, minimum: 0 }
        end_offset: { type: integer, minimum: 0 }
        quote: { type: string }
        prefix: { type: string }
        suffix: { type: string }
    CreateCommentThreadRequest:
      type: object
      required: [anchor, body]
      properties:
        anchor: { $ref: '#/components/schemas/TextAnchor' }
        body: { type: string, minLength: 1 }
    DocumentRef:
      oneOf:
        - type: object
          required: [kind, source_version_id]
          properties:
            kind: { const: source_version }
            source_version_id: { type: string, format: uuid }
        - type: object
          required: [kind, template_version_id]
          properties:
            kind: { const: template_version }
            template_version_id: { type: string, format: uuid }
        - type: object
          required: [kind, instance_version_id]
          properties:
            kind: { const: instance_version }
            instance_version_id: { type: string, format: uuid }
    CreateDiffRunRequest:
      type: object
      required: [baseline, target]
      properties:
        baseline: { $ref: '#/components/schemas/DocumentRef' }
        target: { $ref: '#/components/schemas/DocumentRef' }
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, format: uuid }
  responses:
    Error:
      description: Standard API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
