      properties:
        mask: { enum: [none, partial, full] }
        view_role_keys:
          type: array
          maxItems: 50
          items: { type: string, pattern: '^[a-z][a-z0-9_-]{0,49}$' }
    SchemaFieldInput:
      type: object
      additionalProperties: false
      required:
        [
          key,
          json_path,
          description,
          value_type,
          array_item_type,
          required,
          nullable,
          default,
          sensitivity,
          constraints,
          examples,
          extraction_hint,
          display,
          metadata,
          position,
        ]
      properties:
        key: { type: string, maxLength: 64, pattern: '^[A-Za-z_][A-Za-z0-9_]*$' }
        json_path:
          type: string
          minLength: 3
          maxLength: 500
          pattern: '^\$(?:\.[A-Za-z_][A-Za-z0-9_]*)+$'
        description: { type: string, maxLength: 2000 }
        value_type: { enum: [string, number, integer, boolean, date, datetime, object, array] }
