spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DOCMIND_DATABASE_URL:jdbc:postgresql://localhost:5432/docmind}
    username: ${DOCMIND_DATABASE_USER:docmind}
    password: ${DOCMIND_DATABASE_PASSWORD:12345678}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  data:
    redis:
      host: ${DOCMIND_REDIS_HOST:localhost}
      port: ${DOCMIND_REDIS_PORT:6379}
      password: ${DOCMIND_REDIS_PASSWORD:12345678}
      timeout: 2s
  rabbitmq:
    host: ${DOCMIND_RABBITMQ_HOST:localhost}
    port: ${DOCMIND_RABBITMQ_PORT:5672}
    username: ${DOCMIND_RABBITMQ_USER:docmind}
    password: ${DOCMIND_RABBITMQ_PASSWORD:12345678}
    connection-timeout: 3s

docmind:
  native-editor:
    enabled: ${DOCMIND_NATIVE_EDITOR_ENABLED:true}
    jwt-secret: ${DOCMIND_ONLYOFFICE_JWT_SECRET:local-only-docmind-onlyoffice-jwt-secret-change-before-production}
  ai:
    enabled: ${DOCMIND_AI_ENABLED:true}
    base-url: ${DOCMIND_AI_BASE_URL:http://127.0.0.1:8090}
    internal-token: ${DOCMIND_AI_INTERNAL_TOKEN:local-only-docmind-document-ai-token-change-before-production}
    connect-timeout: ${DOCMIND_AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${DOCMIND_AI_READ_TIMEOUT:60s}
    circuit-failure-threshold: ${DOCMIND_AI_CIRCUIT_FAILURE_THRESHOLD:5}
    circuit-open-duration: ${DOCMIND_AI_CIRCUIT_OPEN_DURATION:30s}
  template:
    libreoffice-command: ${DOCMIND_LIBREOFFICE_COMMAND:soffice}
    preview-timeout: ${DOCMIND_TEMPLATE_PREVIEW_TIMEOUT:45s}
  crypto:
    key-id: ${DOCMIND_CRYPTO_KEY_ID:local-v1}
    master-key-base64: ${DOCMIND_CRYPTO_MASTER_KEY_BASE64:ZG9jbWluZC1sb2NhbC1tYXN0ZXIta2V5LTIwMjYhISE=}
  auth:
    issuer: docmind-server
    audience: docmind-web
    access-token-ttl: ${DOCMIND_AUTH_ACCESS_TOKEN_TTL:30m}
    secret: ${DOCMIND_AUTH_SECRET:local-only-docmind-auth-secret-change-before-production-2026}
  bootstrap:
    enabled: ${DOCMIND_BOOTSTRAP_ENABLED:true}
    email: ${DOCMIND_BOOTSTRAP_EMAIL:admin@docmind.local}
    password: ${DOCMIND_BOOTSTRAP_PASSWORD:DocMind123!}
    display-name: ${DOCMIND_BOOTSTRAP_DISPLAY_NAME:本地管理员}
    workspace-name: ${DOCMIND_BOOTSTRAP_WORKSPACE_NAME:DocMind 演示工作区}
    workspace-slug: ${DOCMIND_BOOTSTRAP_WORKSPACE_SLUG:docmind-demo}
  storage:
    endpoint: ${DOCMIND_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${DOCMIND_MINIO_USER:minioadmin}
    secret-key: ${DOCMIND_MINIO_PASSWORD:12345678}
    upload-url-ttl: ${DOCMIND_UPLOAD_URL_TTL:15m}
    buckets:
      sources: ${DOCMIND_MINIO_BUCKET_SOURCES:docmind-sources}
      previews: ${DOCMIND_MINIO_BUCKET_PREVIEWS:docmind-previews}
      templates: ${DOCMIND_MINIO_BUCKET_TEMPLATES:docmind-templates}
      exports: ${DOCMIND_MINIO_BUCKET_EXPORTS:docmind-exports}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis,rabbit,minio
