    // ==========================================

    function initRouter() {
      window.addEventListener('hashchange', handleRoute);
      if (!location.hash) {
        location.hash = '#workbench';
      } else {
        handleRoute();
      }
    }

    function handleRoute() {
      const hashStr = location.hash || '#workbench';
      const [path, queryStr] = hashStr.split('?');
      state.currentHash = path;
      state.params = parseQuery(queryStr);
      renderApp();
    }

    function parseQuery(queryString) {
      const params = {};
      if (!queryString) return params;
      const pairs = queryString.split('&');
      for (const pair of pairs) {
        const [key, val] = pair.split('=');
        params[decodeURIComponent(key)] = decodeURIComponent(val || '');
      }
      return params;
    }

    function navigateTo(hash) {
      location.hash = hash;
    }

    // Role switcher logic
    function switchRole(roleKey) {
      state.currentRole = roleKey;
      state.currentUser = USERS.find(u => u.role === roleKey) || USERS[0];
      showToast(`已切换演练角色为：${ROLES[roleKey].name}`, 'info');
      renderApp();
    }

    // Toast Notification System
    function showToast(message, type = 'success') {
      const id = 'toast-' + Date.now();
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colors = {
        success: 'bg-emerald-800/90 text-white border-emerald-700',
        error: 'bg-rose-800/90 text-white border-rose-700',
        warning: 'bg-amber-800/90 text-white border-amber-700',
        info: 'bg-slate-900/90 text-white border-slate-700'
      };

      const icons = {
        success: 'check-circle-2',
        error: 'alert-triangle',
        warning: 'alert-circle',
        info: 'info'
      };

      const toastEl = document.createElement('div');
      toastEl.id = id;
      toastEl.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl backdrop-blur-md border border-white/10 text-sm font-medium slide-up ${colors[type]}`;
      toastEl.innerHTML = `
        <i data-lucide="${icons[type]}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1">${escapeHtml(message)}</span>
        <button onclick="document.getElementById('${id}')?.remove()" class="opacity-60 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>
      `;

      container.appendChild(toastEl);
      lucide.createIcons();

      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) {
          el.classList.add('opacity-0', 'transition-opacity');
          setTimeout(() => el.remove(), 300);
        }
      }, 3500);
    }

    // Helper Modal Renderers
    function openModal(contentHtml) {
      const container = document.getElementById('modal-container');
      container.innerHTML = `<div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-gray-100 slide-up">${contentHtml}</div>`;
      container.classList.remove('hidden');
      container.classList.add('flex');
      lucide.createIcons();
    }

    function closeModal() {
      const container = document.getElementById('modal-container');
      container.classList.add('hidden');
      container.classList.remove('flex');
      container.innerHTML = '';
    }

    function openDrawer(contentHtml) {
      const container = document.getElementById('drawer-container');
      container.innerHTML = `<div class="bg-white w-full max-w-md h-full shadow-2xl overflow-y-auto border-l border-gray-100 slide-in-right p-6">${contentHtml}</div>`;
      container.classList.remove('hidden');
      container.classList.add('flex');
      lucide.createIcons();
    }

    function closeDrawer() {
      const container = document.getElementById('drawer-container');
      container.classList.add('hidden');
      container.classList.remove('flex');
      container.innerHTML = '';
    }

    function confirmAction(title, message, onConfirm, isDanger = false) {
      openModal(`
        <div class="p-6">
          <div class="w-10 h-10 rounded-full ${isDanger ? 'bg-rose-100 text-rose-600' : 'bg-blue-100 text-blue-600'} flex items-center justify-center mb-4">
            <i data-lucide="${isDanger ? 'alert-triangle' : 'help-circle'}" class="w-5 h-5"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-900">${escapeHtml(title)}</h3>
          <p class="text-sm text-slate-500 mt-2 leading-relaxed">${escapeHtml(message)}</p>
          <div class="mt-6 flex justify-end gap-3">
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
            <button id="confirm-btn" class="px-4 py-2 text-sm font-medium text-white ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-apple-blue hover:bg-apple-blueHover'} rounded-lg shadow-sm">确认操作</button>
          </div>
        </div>
      `);
      document.getElementById('confirm-btn').onclick = () => {
        closeModal();
        onConfirm();
      };
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function checkPermission(requiredRoleArr, actionName = '此操作') {
      if (state.currentRole === 'OWNER' || state.currentRole === 'ADMIN') return true;
      if (requiredRoleArr.includes(state.currentRole)) return true;
      showToast(`权限受限：当前角色为 [${ROLES[state.currentRole].name}]，缺乏执行 ${actionName} 的功能权限。`, 'error');
      return false;
    }

    // Mask sensitivity helper
    function maskSensitive(val, fieldName) {
      if (['OWNER', 'ADMIN', 'REVIEWER'].includes(state.currentRole)) return val;
      if (!val) return val;
      if (fieldName.includes('电话')) return val.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
      if (fieldName.includes('账户') || fieldName.includes('卡')) return '6222****' + val.slice(-4);
      return '**** (脱敏保护)';
    }

    function renderApp() {
      const app = document.getElementById('app');

      // Standalone full views without global app frame (e.g. login, external fill)

        app.innerHTML = renderLoginPage();
        lucide.createIcons();
        return;
      }

    function simulateUploadProcess() {
      const dropzone = document.getElementById('upload-dropzone');
      const progressBox = document.getElementById('upload-progress-box');
      const bar = document.getElementById('upload-bar');
      const percent = document.getElementById('upload-percent');
      const statusText = document.getElementById('upload-status-text');

      dropzone.classList.add('hidden');
      progressBox.classList.remove('hidden');

      let p = 0;
      const interval = setInterval(() => {
        p += 20;
        bar.style.width = p + '%';
        percent.innerText = p + '%';

        if (p === 40) {
          statusText.innerText = 'SHA-256 校验码: 8f9b...a102 | 正在与对象存储同步...';
        } else if (p === 80) {
          statusText.innerText = '正在生成只读 PDF 矢量预览图谱...';
        } else if (p >= 100) {
          clearInterval(interval);
          statusText.innerText = '验证完成！原件已成功入库。';
          setTimeout(() => {
            closeModal();
            state.assets.unshift({
              id: 'ast-' + Date.now(),
              name: '2026年半年度财务合规报告_新增原件.pdf',
              format: 'PDF',
              size: '3.2 MB',
              uploader: state.currentUser.name,
              time: '刚刚',

              status: 'ready',
              versions: [{ v: 'v1.0', time: '刚刚', size: '3.2 MB' }]
            });
            showToast('原始文档已安全保存并完成验证！');
            renderApp();
          }, 600);
        }
      }, 250);
    }

                  <span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-semibold rounded-full">已生效</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900">${escapeHtml(p.name)}</h3>
                <p class="text-xs text-slate-500">包含识别类型: ${p.piiTypes.join(', ')}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- M. Settings & Members Page ---
    function renderMembersPage() {
      return `
        <div class="space-y-6 fade-in">
          <div class="border-b pb-3">
            <h1 class="text-lg font-bold text-slate-900">成员与权限管理</h1>
            <p class="text-xs text-slate-500">管理工作区成员、角色分配与双人复核开关。</p>
          </div>

          <div class="bg-white rounded-apple-card border border-apple-border shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-apple-border text-[11px] font-semibold text-slate-500 uppercase tracking-wider">
                  <th class="p-3.5 pl-6">成员姓名</th>
                  <th class="p-3.5">工作邮箱</th>
                  <th class="p-3.5">分配角色</th>
                  <th class="p-3.5 pr-6 text-right">操作</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs">
                ${state.members.map(m => `
                  <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-3.5 pl-6 font-bold text-slate-900 flex items-center gap-2">
                      <img src="${m.avatar}" class="w-6 h-6 rounded-full object-cover">
                      <span>${escapeHtml(m.name)}</span>
                    </td>
                    <td class="p-3.5 text-slate-500">${escapeHtml(m.email)}</td>
                    <td class="p-3.5"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${ROLES[m.role].badge}">${ROLES[m.role].name}</span></td>
                    <td class="p-3.5 pr-6 text-right">
                      <button onclick="showToast('已向用户发送角色调整通知', 'info')" class="text-apple-blue hover:underline">修改角色</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- N. Model Config Page ---
    function renderModelConfigPage() {
      return `
        <div class="max-w-xl mx-auto space-y-6 fade-in py-4">
          <div class="bg-white p-6 rounded-apple-card border border-apple-border shadow-sm space-y-4 text-xs">
            <div class="border-b pb-3">
              <h1 class="text-base font-bold text-slate-900">大模型 API Endpoint 与 Key 配置</h1>
              <p class="text-xs text-slate-400">配置 Gemini / LLM 密钥与 Prompt 版本掩码控制。</p>
            </div>

            <div>
              <label class="block font-semibold text-slate-700 mb-1">模型供应商 / 协议</label>
              <select class="w-full bg-slate-50 border rounded-lg p-2.5">
                <option>Google Gemini API (Gemini 2.5 Pro)</option>
                <option>Anthropic Claude 3.5 Sonnet</option>
              </select>
            </div>

            <div>
              <label class="block font-semibold text-slate-700 mb-1">API Key 密钥 (格式掩码)</label>
              <input type="password" value="AIzaSyA889210-XXXX-XXXX-MASKED" class="w-full bg-slate-50 border rounded-lg p-2.5 font-mono">
            </div>

            <div class="pt-2 flex justify-end gap-2">
              <button onclick="showToast('连接测试成功！P95 延迟 1.2s', 'success')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">测试网络连接</button>
              <button onclick="showToast('模型配置已加密保存', 'success')" class="px-4 py-2 bg-apple-blue text-white rounded-lg">保存配置</button>
            </div>
          </div>
        </div>
      `;
    }

    // --- O. Audit Logs Page ---
    function renderAuditPage() {
      return `
        <div class="space-y-6 fade-in">
          <div class="border-b pb-3 flex justify-between items-center">
            <div>
              <h1 class="text-lg font-bold text-slate-900">不可篡改审计日志</h1>
              <p class="text-xs text-slate-500">记录系统所有操作者、动作、对象与内部快照结果。</p>
            </div>
            <button onclick="showToast('已导出加密审计报告 (CSV)', 'success')" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">导出审计记录</button>
          </div>

          <div class="bg-white rounded-apple-card border border-apple-border shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-apple-border text-[11px] font-semibold text-slate-500 uppercase tracking-wider">
                  <th class="p-3.5 pl-6">时间</th>
                  <th class="p-3.5">操作者</th>
                  <th class="p-3.5">执行动作</th>
                  <th class="p-3.5">目标类型 / ID</th>
                  <th class="p-3.5">客户端 IP</th>
                  <th class="p-3.5 pr-6 text-right">结果</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs font-mono">
                ${state.auditLogs.map(l => `
                  <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-3.5 pl-6 text-slate-400">${l.time}</td>
                    <td class="p-3.5 font-bold font-sans text-slate-800">${escapeHtml(l.operator)}</td>
                    <td class="p-3.5 font-sans font-semibold text-slate-900">${escapeHtml(l.action)}</td>
                    <td class="p-3.5 text-slate-500">${escapeHtml(l.objectType)} (${l.objectId})</td>
                    <td class="p-3.5 text-slate-400">${l.ip}</td>
                    <td class="p-3.5 pr-6 text-right font-sans"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded">${l.result}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- P. Drawers & Extras ---
    function openNotificationsDrawer() {
      openDrawer(`
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-bold text-slate-900 text-sm">通知中心</h3>
            <button onclick="closeDrawer()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <div class="space-y-2">
            ${state.notifications.map(n => `
              <a href="${n.targetHash}" onclick="closeDrawer()" class="block p-3 rounded-xl border border-slate-100 hover:border-apple-blue hover:bg-blue-50/30 transition-all">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-xs text-slate-900">${escapeHtml(n.title)}</span>
                  <span class="text-[10px] text-slate-400">${n.time}</span>
                </div>
                <p class="text-xs text-slate-600 mt-1">${escapeHtml(n.content)}</p>
              </a>
            `).join('')}
          </div>
        </div>
      `);
    }

    function renderNoPermissionPage() {
      return `
        <div class="h-96 flex flex-col items-center justify-center text-center space-y-3">
          <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center">
            <i data-lucide="lock" class="w-6 h-6"></i>
          </div>
          <h2 class="text-base font-bold text-slate-900">访问权限受限</h2>
          <p class="text-xs text-slate-500 max-w-sm">当前演练角色 [${ROLES[state.currentRole].name}] 缺乏此模块的查看或管理权限。</p>
          <button onclick="switchRole('OWNER')" class="px-4 py-2 bg-apple-blue text-white rounded-lg text-xs font-medium">一键切换为 Workspace Owner</button>
        </div>
      `;
    }

    function render404Page() {
      return `
        <div class="h-96 flex flex-col items-center justify-center text-center space-y-3">
          <h2 class="text-2xl font-bold text-slate-900">404</h2>
          <p class="text-xs text-slate-500">未找到所请求的页面资源或路由</p>
          <a href="#workbench" class="px-4 py-2 bg-apple-blue text-white rounded-lg text-xs font-medium">返回工作台</a>
        </div>
      `;
    }

    // ==========================================
    // 5. BOOTSTRAP INITIALIZATION
    // ==========================================

    window.addEventListener('DOMContentLoaded', () => {
      initRouter();
    });
  </script>
</body>
</html>
