services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: docmind-postgres
    environment:
      POSTGRES_DB: ${DOCMIND_POSTGRES_DB:-docmind}
      POSTGRES_USER: ${DOCMIND_POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${DOCMIND_POSTGRES_PASSWORD:-12345678}
    ports:
      - "127.0.0.1:${DOCMIND_POSTGRES_PORT:-5432}:5432"
    volumes:
      - docmind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: docmind-redis
    environment:
      REDIS_PASSWORD: ${DOCMIND_REDIS_PASSWORD:-12345678}
    command: ["redis-server", "--requirepass", "${DOCMIND_REDIS_PASSWORD:-12345678}"]
    ports:
      - "127.0.0.1:${DOCMIND_REDIS_PORT:-6379}:6379"
    volumes:
      - docmind-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: docmind-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${DOCMIND_RABBITMQ_USER:-docmind}
      RABBITMQ_DEFAULT_PASS: ${DOCMIND_RABBITMQ_PASSWORD:-12345678}
    ports:
      - "127.0.0.1:${DOCMIND_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${DOCMIND_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - docmind-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: docmind-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DOCMIND_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DOCMIND_MINIO_PASSWORD:-12345678}
    ports:
      - "127.0.0.1:${DOCMIND_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${DOCMIND_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - docmind-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${DOCMIND_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DOCMIND_MINIO_PASSWORD:-12345678}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/docmind-sources &&
        mc mb --ignore-existing local/docmind-previews &&
        mc mb --ignore-existing local/docmind-templates &&
        mc mb --ignore-existing local/docmind-exports
    restart: "no"

volumes:
  docmind-postgres:
  docmind-redis:
  docmind-rabbitmq:
  docmind-minio:
