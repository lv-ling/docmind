spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: jdbc:h2:mem:docmind;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  health:
    minio:
      enabled: false

docmind:
  jobs:
    enabled: false
  ai:
    enabled: false
    base-url: http://127.0.0.1:8090
    internal-token: test-only-docmind-ai-internal-token-at-least-thirty-two-bytes
    connect-timeout: 100ms
    read-timeout: 1s
    circuit-failure-threshold: 2
    circuit-open-duration: 1s
  crypto:
    key-id: test-v1
    master-key-base64: ZG9jbWluZC1sb2NhbC1tYXN0ZXIta2V5LTIwMjYhISE=
  auth:
    issuer: docmind-api-test
    audience: docmind-web-test
    access-token-ttl: 5m
    secret: test-only-docmind-auth-secret-at-least-thirty-two-bytes
  bootstrap:
    enabled: false
  storage:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    upload-url-ttl: 15m
    upload-cleanup-enabled: false
    buckets:
      sources: test-sources
      previews: test-previews
      templates: test-templates
      exports: test-exports
